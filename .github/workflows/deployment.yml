name: Deployment

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # for debugging purposes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :polyloader-desktop:shadowJar --no-daemon
      - name: Upload JARs
        uses: actions/upload-artifact@v7
        with:
          name: polyloader-desktop
          path: |
            polyloader-desktop/build/libs/polyloader-desktop.jar
  deploy:
    needs: build
    runs-on:
      ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        include:
          - os: windows-latest
            ext: zip
            output_name: "\[Windows\]Polyloader"
          - os: ubuntu-latest
            ext: tar.gz
            output_name: "\[Linux\]Polyloader"
          - os: macos-latest
            ext: tar.gz
            output_name: "\[MacOS\]Polyloader"
    steps:
      - uses: actions/checkout@v7
      - name: Download Polyloader Jar
        uses: actions/download-artifact@v8
        with:
          name: polyloader-desktop
          path: build
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
      - name: JPackage
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --input build \
            --name Polyloader \
            --main-class org.im.polyloader.Polyloader \
            --main-jar polyloader-desktop.jar \
            --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=2"
            --dest deploy
      - name: Linux/Macos Archive
        if: runner.os != 'Windows'
        run: tar -czvf ${{ matrix.output_name }}.${{ matrix.ext }} -C deploy .
      - name: Windows Archive
        if: runner.os == 'Windows'
        run: Compress-Archive -Path deploy/Polyloader -DestinationPath ${{ matrix.output_name }}.${{ matrix.ext }}
      - name: Upload Archives
        uses: actions/upload-artifact@v7
        with:
          name: deploy-${{ matrix.output_name }}
          path: ${{ matrix.output_name }}.${{ matrix.ext }}
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Releases
        uses: actions/download-artifact@v8
        with:
          path: releases
          pattern: deploy-*
          merge-multiple: true
      - name: Upload Releases
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: releases/*