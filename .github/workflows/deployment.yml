name: Deployment

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :polyloader-desktop:shadowJar
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: polyloader-desktop
          path: |
            polyloader-desktop/build/libs/polyloader-desktop.jar
  deploy:
    needs: build
    runs-on:
      ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        include:
          - os: windows-latest
            ext: zip
            output_name: "[Windows]Polyloader"
          - os: ubuntu-latest
            ext: tar.gz
            output_name: "[Linux]Polyloader"
          - os: macos-latest
            ext: tar.gz
            output_name: "[MacOS]Polyloader"
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"
      - name: JPackage
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --input polyloader-desktop/build/libs \
            --name Polyloader \
            --main-class org.im.polyloader.Polyloader \
            --main-jar polyloader-desktop.jar \
            --dest deploy
      - name: Linux/Macos Archive
        if: runner.os != "Windows"
        run: tar -czvf ../${{ matrix.output_name }}.${{ matrix.ext }} -C deploy Polyloader
      - name: Windows Archive
        if: runner.os == "Windows"
        run: Compress-Archive -Path deploy/Polyloader -DestinationPath ${{ matrix.output_name }}.${{ matrix.ext }}
      - name: Upload Archives
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}.${{ matrix.ext }}
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - uses: softprops/actions-gh-release@v2
        if: startsWith(github.ref, 'refs/tags')
        with:
          files: builds/*