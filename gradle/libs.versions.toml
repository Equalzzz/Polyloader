[versions]
# I have Gradle 9.0.0, which supports 2.2.0 max... It ain't that important anyway
kotlin = "2.3.0"
java = "21"
# Valid values:
# - latest: depend on the latest release of mindustry
# - be: depend on the very latest commit of mindustry
# - v<number>: depend on a specific version
# noinspection UnusedVersionCatalogEntry
mindustry = "v159.7"
shadow = "9.3.0"
serialization-plugin = "2.4.20"
json = "1.11.0"
mixin = "0.8.3"
log4j = "2.26.1"
guava = "33.7.2-jre"
gson = "2.14.0"

asm = "9.10.1"

[plugins]
kotlin-jvm = {id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = {id = "com.gradleup.shadow", version.ref = "shadow"}
serialization = {id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "serialization-plugin"}

[libraries]
json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "json" }
mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api", version.ref = "log4j" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }
guava-jre = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }

[bundles]
asm = ["asm", "asm-tree", "asm-util", "asm-commons"]